<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kist Game - 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- LEFT UI -->
    <section class="ui">

        <div class="brand">
            <span>💰</span>
            Kist Game
        </div>

        <!-- QUESTION 1 -->
        <div class="panel" id="questionOne">

            <h1>आपने किस्त भरी या नहीं?</h1>

            <p>कृपया सही विकल्प चुनें</p>

            <div class="buttons">

                <button class="yes-btn" id="yesBtn">
                    YES
                </button>

                <button class="no-btn" id="noBtn">
                    NO
                </button>

            </div>

        </div>


        <!-- QUESTION 2 -->
        <div class="panel hidden" id="questionTwo">

            <h1>किस्त किस तरह भरना चाहेंगे?</h1>

            <p>Payment का तरीका चुनें</p>

            <div class="buttons">

                <button class="cash-btn" id="cashBtn">
                    💵 पैसे देकर
                </button>

                <button class="gpay-btn" id="gpayBtn">
                    <span class="google-g">G</span> Pay
                </button>

            </div>

        </div>


        <!-- END -->
        <div class="panel end-panel hidden" id="gameEnd">

            <div class="success-icon">
                ✓
            </div>

            <h1>Game End 🎉</h1>

            <p id="endMessage">
                आपकी किस्त सफलतापूर्वक भर दी गई।
            </p>

            <button class="restart-btn" id="restartBtn">
                ↻ फिर से खेलें
            </button>

        </div>

    </section>


    <!-- RIGHT 3D SCENE -->
    <section class="scene">

        <div class="sky"></div>

        <div class="sun"></div>

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>


        <!-- BACKGROUND TREES -->

        <div class="tree tree-one">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <div class="tree tree-two">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>


        <!-- GROUND -->

        <div class="ground">

            <div class="grass"></div>

            <div class="path"></div>

        </div>


        <!-- RED CHARACTER -->

        <div class="character red-character" id="redCharacter">

            <div class="shadow"></div>

            <div class="head">

                <div class="hair"></div>

                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>

                <div class="nose"></div>

                <div class="mouth"></div>

            </div>


            <div class="neck"></div>


            <div class="torso">

                <div class="shirt-shine"></div>

            </div>


            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>


            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>


            <div class="shoe shoe-left"></div>
            <div class="shoe shoe-right"></div>

        </div>


        <!-- BLUE CHARACTER -->

        <div class="character blue-character" id="blueCharacter">

            <div class="shadow"></div>

            <div class="head">

                <div class="hair"></div>

                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>

                <div class="nose"></div>

                <div class="mouth"></div>

            </div>


            <div class="neck"></div>


            <div class="torso">

                <div class="shirt-shine"></div>

            </div>


            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>


            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>


            <div class="shoe shoe-left"></div>
            <div class="shoe shoe-right"></div>

        </div>


        <!-- STATUS -->

        <div class="status" id="status">
            Just for Fun 😎
        </div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
